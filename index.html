<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>幸運轉盤</title>
<meta name="theme-color" content="#f8f0e4">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="幸運轉盤">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 少女系：米色底、粉嫩配色。刻意只做一套淺色，深色模式也維持米色 */
:root{
  --bg:#f8f0e4; --bg2:#f3e6d8; --sur:#fffaf5; --line:#eddccf; --line2:#dcc3b3;
  --ink:#5a3e4f; --ink2:#8a6f7d; --ink3:#b09aa5;
  --red:#f27ea6; --red2:#d95f8c; --accL:#f9a9c5; --accXL:#fbd6e3; --cream:#fff5ec; --white:#fff;
  --seg:#5a3e4f; --dotc:#eedbd0; --g1:rgba(242,126,166,.16); --g2:rgba(211,194,242,.28); --g3:rgba(201,234,217,.35);
  --teal:#9ad5c9;
  --shadow:0 10px 30px rgba(120,70,90,.12);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "Chocolate Classical Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12% 0%,var(--g1),transparent 45%),
    radial-gradient(circle at 92% 8%,var(--g2),transparent 40%),
    radial-gradient(circle at 50% 110%,var(--g3),transparent 45%),
    radial-gradient(circle at 1px 1px,var(--dotc) 1.2px,transparent 0);
  background-size:100% 100%,100% 100%,100% 100%,24px 24px}
.wrap{max-width:1040px;margin:0 auto;padding-block:22px 48px;padding-inline:16px}
.disp{font-family:"Chocolate Classical Sans","Noto Sans TC",system-ui,sans-serif;font-weight:700;letter-spacing:.5px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:clamp(28px,5vw,38px);line-height:1.1;color:var(--red);text-wrap:balance}
header h1 #sub{display:block;font-size:14px;font-weight:400;color:var(--ink3);letter-spacing:1px;margin-top:6px}
.ed{display:inline-block;min-width:2em;border-radius:8px;padding:0 4px;margin-left:-4px;cursor:text;outline:none;
  border-bottom:2px dashed transparent;transition:border-color .15s,background .15s}
.ed:hover{border-bottom-color:var(--line2)}
.ed:focus{border-bottom-color:var(--red);background:var(--bg2)}
.ed:empty:before{content:attr(data-ph);color:inherit;opacity:.45}
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px;
  background:var(--sur);border:1.5px solid var(--line);color:var(--ink2);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--sur);border:1.5px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}

/* 轉盤舞台 */
.stage{padding:26px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:18px;
  background:linear-gradient(180deg,var(--sur),var(--bg2))}
.box{position:relative;width:min(100%,440px);max-width:100%;aspect-ratio:1}
#wheel{display:block;width:100%;height:100%;border-radius:50%;
  box-shadow:0 0 0 8px var(--white),0 0 0 14px var(--red),0 0 0 18px var(--cream),0 18px 40px rgba(60,40,50,.28)}
.ptr{position:absolute;left:50%;top:-18px;transform:translateX(-50%);z-index:3;width:44px;height:58px;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.35))}
.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;height:24%;border-radius:50%;z-index:2;
  border:0;cursor:pointer;color:#fff;font-size:clamp(17px,4.4vw,28px);line-height:1;letter-spacing:1.5px;
  display:flex;align-items:center;justify-content:center;padding-left:2px;
  background:linear-gradient(180deg,var(--accL),var(--red));
  box-shadow:0 0 0 6px var(--white),0 0 0 8px var(--accXL),0 7px 0 6px var(--red2),0 12px 22px rgba(60,40,50,.3);
  transition:transform .1s,box-shadow .1s}
.hub:hover{filter:brightness(1.05)}
.hub:active{transform:translate(-50%,calc(-50% + 4px));box-shadow:0 0 0 6px var(--white),0 0 0 8px var(--accXL),0 3px 0 6px var(--red2),0 6px 14px rgba(60,40,50,.3)}
.hub:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
.hub[disabled]{cursor:wait;filter:saturate(.5)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn{font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:14px;padding:10px 20px;
  background:var(--sur);color:var(--ink);border:1.5px solid var(--line2);box-shadow:0 3px 0 var(--line2);
  transition:transform .08s,box-shadow .08s,filter .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line2)}
.btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.main{background:var(--red);border-color:var(--red2);color:#fff;box-shadow:0 4px 0 var(--red2);font-size:16px;padding:12px 28px}
.btn.main:active{box-shadow:0 1px 0 var(--red2)}
.btn.sm{font-size:13px;padding:7px 14px;border-radius:11px}
.btn.flat{background:transparent;box-shadow:none;border-color:var(--line);color:var(--ink2)}
.btn.flat:hover{color:var(--ink);border-color:var(--line2)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none;transform:none}
.count{font-size:13px;color:var(--ink3);user-select:none}
.count b{color:var(--red);font-variant-numeric:tabular-nums}

/* 側欄 */
.side{display:flex;flex-direction:column;gap:18px}
.sec{padding:16px 16px 14px}
.sec h2{font-size:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec h2 small{color:var(--ink3);font-size:12px;font-weight:400}
.list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto}
.row{display:grid;grid-template-columns:14px 1fr 66px 30px;gap:8px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 1px var(--line2)}
input[type=text],input[type=number]{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;width:100%;min-width:0}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px var(--accXL)}
input[type=number]{text-align:center;font-variant-numeric:tabular-nums}
.row.sec-on{grid-template-columns:14px 1fr 66px auto 30px}
.row .ghost{font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;cursor:pointer;
  background:var(--bg);border:1.5px solid var(--line);color:var(--ink2)}
.row .ghost.on{background:var(--ink);color:var(--sur);border-color:var(--ink)}
.del{border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:4px;border-radius:8px}
.del:hover{color:var(--red);background:var(--bg2)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1}
.hint{font-size:12px;color:var(--ink3);margin-top:8px}
.opts{display:flex;flex-direction:column;gap:9px;font-size:14px}
.opts label{display:flex;align-items:center;gap:8px;cursor:pointer}
.opts input[type=checkbox]{width:17px;height:17px;accent-color:var(--red)}
.opts input[type=number]{width:70px}
.themes-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff;cursor:pointer;padding:0;
  box-shadow:0 0 0 1.5px var(--swc);transition:transform .1s,box-shadow .1s}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 3px var(--swc);transform:scale(1.18)}
.sw:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hist{list-style:none;display:flex;flex-direction:column;gap:6px;max-height:230px;overflow:auto;font-size:14px}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:6px 11px;border-radius:11px;background:var(--bg);border:1px solid var(--line)}
.hist li time{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist li.none{justify-content:center;color:var(--ink3);background:none;border:0;font-size:13px}

/* 結果 */
.mask[hidden]{display:none}
.mask{position:fixed;inset:0;background:rgba(90,62,79,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal{background:var(--sur);border:2px solid var(--red);border-radius:30px;box-shadow:0 10px 0 var(--red2),0 30px 60px rgba(90,62,79,.45);
  padding:30px 26px 26px;text-align:center;max-width:420px;width:100%;animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.55) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.modal .lbl{font-size:13px;color:var(--ink3);letter-spacing:3px}
.modal .prize{font-size:clamp(30px,8vw,46px);color:var(--red);margin:6px 0 20px;word-break:break-all;line-height:1.2;text-wrap:balance}
.modal .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:19}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <header>
    <h1 class="disp"><span id="ttl" class="ed" contenteditable="true" spellcheck="false" data-ph="幸運轉盤" title="點一下可以改標題"></span><span id="sub" class="ed" contenteditable="true" spellcheck="false" data-ph="自己填獎項，按中間的 GO 就轉" title="點一下可以改說明"></span></h1>
    <div class="hdr-r">
      <span class="chip" id="cnt"></span>
      <button class="btn sm flat" id="reloadBtn" title="重新載入最新版，設定不會不見">↻ 重新整理</button>
    </div>
  </header>

  <div class="grid">
    <section class="card stage">
      <div class="box">
        <svg class="ptr" viewBox="0 0 44 58" aria-hidden="true">
          <path d="M22 56 L3 14 A21 21 0 1 1 41 14 Z" style="fill:var(--red);stroke:var(--white)" stroke-width="3"/>
          <path d="M22 26 C18 20 11 21 12 15 C13 10 19 10 22 14 C25 10 31 10 32 15 C33 21 26 20 22 26 Z" style="fill:var(--white)"/>
        </svg>
        <canvas id="wheel" width="900" height="900" aria-label="抽獎轉盤"></canvas>
        <button class="hub disp" id="hub" title="轉一下">GO</button>
      </div>
      <div class="actions">
        <button class="btn main" id="spinBtn">開始抽獎</button>
      </div>
      <div class="count">已抽 <b id="spun">0</b> 次</div>
    </section>

    <div class="side">
      <section class="card sec">
        <h2 class="disp">獎項</h2>
        <div class="list" id="list"></div>
        <div class="addrow">
          <input type="text" id="newName" placeholder="新增獎項名稱" maxlength="20">
          <button class="btn sm" id="addBtn">＋ 新增</button>
        </div>
        <div class="addrow">
          <button class="btn sm flat" id="defaultBtn">還原預設</button>
        </div>
      </section>

      <section class="card sec">
        <h2 class="disp">選項</h2>
        <div class="opts">
          <label><input type="checkbox" id="optRemove"> 抽中後從轉盤移除（不重複中獎）</label>
          <label><input type="checkbox" id="optSound" checked> 轉動音效</label>
          <label>轉動時間 <input type="number" id="optDur" min="2" max="15" step="1" value="6"> 秒</label>
          <div class="themes-row">風格 <div class="themes" id="themes"></div></div>
        </div>
      </section>

      <section class="card sec">
        <h2 class="disp">紀錄 <button class="btn sm flat" id="clearHist">清除</button></h2>
        <ul class="hist" id="hist"></ul>
      </section>
    </div>
  </div>
</div>

<div class="mask" id="mask" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="prizeTxt">
    <div class="lbl">恭喜抽中</div>
    <div class="prize disp" id="prizeTxt"></div>
    <div class="acts">
      <button class="btn main" id="againBtn">再抽一次</button>
      <button class="btn flat" id="closeBtn">關閉</button>
    </div>
  </div>
</div>

<script>
/* ── 資料 ── */
const KEY='lucky-wheel-v1';
/* 10 種風格。v 是 CSS 變數，c 是轉盤格子的顏色（依序循環） */
const THEMES=[
 /* 亮色 */
 {n:'草莓牛奶',v:{bg:'#f8f0e4',bg2:'#f3e6d8',sur:'#fffaf5',line:'#eddccf',line2:'#dcc3b3',ink:'#5a3e4f',ink2:'#8a6f7d',ink3:'#b09aa5',
   red:'#f27ea6',red2:'#d95f8c',accL:'#f9a9c5',accXL:'#fbd6e3',cream:'#fff5ec',white:'#fff',seg:'#5a3e4f',dotc:'#eedbd0',
   g1:'rgba(242,126,166,.16)',g2:'rgba(211,194,242,.28)',g3:'rgba(201,234,217,.35)'},
  c:['#f9b4cc','#ffd9b0','#c3e8d8','#d6c6f4','#fff1b8','#ffc2c2','#bfe0f5','#f7cfe9']},
 {n:'薰衣草',v:{bg:'#f3eff8',bg2:'#e9e2f3',sur:'#fcfaff',line:'#e0d6ee',line2:'#c9bade',ink:'#4a3d5e',ink2:'#7a6b92',ink3:'#a598b8',
   red:'#a98be0',red2:'#8c6cc9',accL:'#c5aef0',accXL:'#e6dbf8',cream:'#f6f0ff',white:'#fff',seg:'#4a3d5e',dotc:'#e3dbee',
   g1:'rgba(169,139,224,.2)',g2:'rgba(242,126,166,.14)',g3:'rgba(191,224,245,.35)'},
  c:['#d9c8f5','#f5c6e8','#c8d9f8','#e8dcff','#fbe0f1','#cfe5f5','#f0d5ff','#e2ecff']},
 {n:'薄荷蘇打',v:{bg:'#eef7f3',bg2:'#e0f0e9',sur:'#fafffd',line:'#d3e8df',line2:'#b6d5c8',ink:'#2f4f45',ink2:'#5f7f74',ink3:'#93b0a6',
   red:'#5fc9b0',red2:'#3faa92',accL:'#8fdccb',accXL:'#cdeee6',cream:'#effbf7',white:'#fff',seg:'#2f4f45',dotc:'#d6e9e1',
   g1:'rgba(95,201,176,.2)',g2:'rgba(191,224,245,.35)',g3:'rgba(255,241,184,.4)'},
  c:['#bfeee0','#c9e9f7','#fff3c4','#d8f5ea','#e0f2ff','#fbe7c8','#c5f0e4','#eaf8ff']},
 {n:'蜜桃',v:{bg:'#fbf1e8',bg2:'#f7e4d5',sur:'#fffaf6',line:'#f0dccb',line2:'#e0c2aa',ink:'#5c3f38',ink2:'#8d6c62',ink3:'#b8988e',
   red:'#f7a17a',red2:'#e5825a',accL:'#fbc0a2',accXL:'#fde2d3',cream:'#fff5ee',white:'#fff',seg:'#5c3f38',dotc:'#f0dbcc',
   g1:'rgba(247,161,122,.2)',g2:'rgba(255,214,176,.35)',g3:'rgba(249,180,204,.22)'},
  c:['#ffd3b8','#ffe6c8','#fbc4c4','#ffefd6','#f9d6e6','#ffdcc2','#fff0e0','#f7cdd8']},
 {n:'天空藍',v:{bg:'#eef4fa',bg2:'#deeaf5',sur:'#fafcff',line:'#d3e2f0',line2:'#b4cce2',ink:'#2f4258',ink2:'#5e7690',ink3:'#93a8bf',
   red:'#7fb6ee',red2:'#5c98d8',accL:'#a9cdf5',accXL:'#d8e8fa',cream:'#f1f7ff',white:'#fff',seg:'#2f4258',dotc:'#d8e5f0',
   g1:'rgba(127,182,238,.22)',g2:'rgba(211,194,242,.25)',g3:'rgba(201,234,217,.35)'},
  c:['#c5dcf8','#dce9ff','#e2d9fb','#cfe8ff','#eaf1ff','#d9f1f7','#d3e3ff','#f0e8ff']},
 /* 暗色 */
 {n:'夜櫻',v:{bg:'#2b2330',bg2:'#372c3e',sur:'#3a3042',line:'#4d4056',line2:'#655670',ink:'#f7eef2',ink2:'#cbb9c4',ink3:'#9c8b97',
   red:'#f48fb3',red2:'#d66a93',accL:'#f8b3cb',accXL:'#6b4a5c',cream:'#4a3b48',white:'#fff4f8',seg:'#4a2c3c',dotc:'#3b3142',
   g1:'rgba(244,143,179,.14)',g2:'rgba(169,139,224,.16)',g3:'rgba(95,201,176,.12)'},
  c:['#f4b6cc','#d9c4f0','#ffd9b8','#c8e6e0','#fbd0e0','#e6d2fa','#ffe6cf','#d3eef0']},
 {n:'星空',v:{bg:'#0f172a',bg2:'#172036',sur:'#1b2540',line:'#2b3a57',line2:'#3e4f70',ink:'#e8f1ff',ink2:'#b6c5e0',ink3:'#7f8fae',
   red:'#38bdf8',red2:'#0ea5e9',accL:'#7dd3fc',accXL:'#1e3a5f',cream:'#243352',white:'#e2f3ff',seg:'#0b1730',dotc:'#1c2740',
   g1:'rgba(56,189,248,.14)',g2:'rgba(129,140,248,.16)',g3:'rgba(34,211,238,.1)'},
  c:['#60a5fa','#38bdf8','#818cf8','#22d3ee','#93c5fd','#67e8f9','#a5b4fc','#7dd3fc']},
 {n:'午夜紫',v:{bg:'#1a1226',bg2:'#241a33',sur:'#2a1f3b',line:'#3d2f52',line2:'#55446e',ink:'#f3ecff',ink2:'#c7b8e0',ink3:'#8f7fa8',
   red:'#b07cff',red2:'#8f5ae6',accL:'#c9a3ff',accXL:'#3f2d5e',cream:'#33264a',white:'#f5eeff',seg:'#22163a',dotc:'#2b2040',
   g1:'rgba(176,124,255,.16)',g2:'rgba(244,143,179,.12)',g3:'rgba(56,189,248,.1)'},
  c:['#c4a3ff','#f0a6d8','#a6b8ff','#d9b8ff','#ffb8e6','#b8c8ff','#e2c8ff','#c8d6ff']},
 {n:'深海',v:{bg:'#0c1f22',bg2:'#132b2f',sur:'#163236',line:'#24474c',line2:'#356065',ink:'#e6f7f5',ink2:'#b0d3cf',ink3:'#7aa19c',
   red:'#2dd4bf',red2:'#14b8a6',accL:'#5eead4',accXL:'#1a4a4a',cream:'#1c3d41',white:'#e6fbf8',seg:'#0a2a2a',dotc:'#183538',
   g1:'rgba(45,212,191,.14)',g2:'rgba(56,189,248,.12)',g3:'rgba(163,230,53,.08)'},
  c:['#5eead4','#67e8f9','#86efac','#2dd4bf','#a7f3d0','#7dd3fc','#bef264','#99f6e4']},
 {n:'黑金',v:{bg:'#141210',bg2:'#1e1a16',sur:'#231e19',line:'#3a322a',line2:'#54493d',ink:'#f5efe4',ink2:'#cbbfae',ink3:'#93887a',
   red:'#f5b942',red2:'#d99a1f',accL:'#f9d27a',accXL:'#4a3a1c',cream:'#332a1e',white:'#fff6e0',seg:'#2a1f0e',dotc:'#26211b',
   g1:'rgba(245,185,66,.14)',g2:'rgba(249,115,22,.1)',g3:'rgba(255,255,255,.04)'},
  c:['#f5b942','#fb923c','#fcd34d','#f59e0b','#fde68a','#fdba74','#facc15','#ffedd5']},
];
let COLORS=THEMES[0].c;
function applyTheme(i){
  const t=THEMES[i]||THEMES[0]; S.theme=THEMES[i]?i:0;
  Object.entries(t.v).forEach(([k,v])=>document.documentElement.style.setProperty('--'+k,v));
  COLORS=t.c;
  document.querySelectorAll('.sw').forEach((b,j)=>b.classList.toggle('on',j===S.theme));
}
const DEFAULT=[
  {n:'頭獎',w:1},{n:'二獎',w:2},{n:'三獎',w:3},{n:'再接再厲',w:6},{n:'銘謝惠顧',w:6},{n:'再轉一次',w:2}
];
let S={items:[],hist:[],spun:0,remove:false,sound:true,dur:6,title:'',sub:'',theme:0};
try{ const j=JSON.parse(localStorage.getItem(KEY)||'null'); if(j&&Array.isArray(j.items)&&j.items.length>=2) S=Object.assign(S,j); }catch(e){}
if(S.items.length<2) S.items=DEFAULT.map(x=>({...x}));
S.items.forEach(x=>{ x.w=Math.max(0,Math.min(999,Math.round(+x.w)||0)); });
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

const $=id=>document.getElementById(id);
const cv=$('wheel'),ctx=cv.getContext('2d'),R=cv.width/2;
let angle=0,busy=false;
/* active：畫在轉盤上的格子（含只展示的）。pool：真的抽得到的 */
const active=()=>S.items.filter(x=>x.w>0);
const pool=()=>active().filter(x=>!x.x);
const totalW=()=>active().reduce((a,b)=>a+b.w,0);
let secret=false;
const cssVar=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();

/* ── 畫 ── */
function draw(){
  const items=active(),tot=totalW();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(R,R); ctx.rotate(angle);
  if(!items.length){
    ctx.fillStyle='#ccc'; ctx.beginPath(); ctx.arc(0,0,R-4,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.fillStyle='#444'; ctx.font='bold 40px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('請先新增獎項',R,R); return;
  }
  let a0=0;
  items.forEach(it=>{
    const a1=a0+Math.PI*2*it.w/tot;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-4,a0,a1); ctx.closePath();
    ctx.fillStyle=COLORS[S.items.indexOf(it)%COLORS.length]; ctx.fill();
    ctx.strokeStyle=cssVar('--white'); ctx.lineWidth=5; ctx.stroke();
    ctx.save(); ctx.rotate((a0+a1)/2);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    const span=(a1-a0)*(R*.62);
    const fs=Math.max(18,Math.min(46,span*.55,(R*.6)/Math.max(2,it.n.length)*1.6));
    ctx.font='700 '+fs+'px "Chocolate Classical Sans","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    ctx.fillStyle=cssVar('--seg');
    ctx.fillText(it.n,R-46,0,R*.62);
    ctx.restore();
    a0=a1;
  });
  ctx.restore();
  /* 外圈小燈 */
  const n=Math.max(16,items.length*3);
  for(let i=0;i<n;i++){
    const t=i/n*Math.PI*2;
    ctx.beginPath(); ctx.arc(R+Math.cos(t)*(R-14),R+Math.sin(t)*(R-14),5.5,0,Math.PI*2);
    ctx.fillStyle=i%2?cssVar('--white'):cssVar('--red'); ctx.fill();
  }
}
/* 指針在正上方，算現在指到誰 */
function pick(){
  const items=active(),tot=totalW();
  let a=(-Math.PI/2-angle)%(Math.PI*2); if(a<0)a+=Math.PI*2;
  let a0=0;
  for(const it of items){ const a1=a0+Math.PI*2*it.w/tot; if(a<a1) return it; a0=a1; }
  return items[items.length-1];
}

/* ── 音效（WebAudio 合成） ── */
let AC=null;
function beep(f=900,d=.03,g=.08){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),v=AC.createGain();
    o.type='square'; o.frequency.value=f;
    v.gain.setValueAtTime(g,AC.currentTime); v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(v); v.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}
const fanfare=()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25,.12),i*110));

/* ── 轉 ── */
function spin(){
  if(busy) return;
  const items=active(),P=pool();
  if(items.length<2){ alert('至少要有 2 個權重大於 0 的獎項'); return; }
  if(!P.length){ alert('至少要有 1 個抽得到的獎項'); return; }
  busy=true; $('hub').disabled=true; $('spinBtn').disabled=true;
  /* 先在抽得到的獎項裡按權重抽出結果，再讓轉盤停進那一格，機率才真的等於權重。
     只展示的格子不在抽的名單裡，所以永遠停不進去 */
  const tot=totalW(),ptot=P.reduce((a,b)=>a+b.w,0);
  let r=Math.random()*ptot,win=P[0];
  for(const it of P){ if(r<it.w){ win=it; break; } r-=it.w; }
  let a0=0; for(const it of items){ if(it===win) break; a0+=Math.PI*2*it.w/tot; }
  const seg=Math.PI*2*win.w/tot;
  const target=a0+seg*(0.12+Math.random()*0.76);
  let cur=angle%(Math.PI*2); if(cur<0)cur+=Math.PI*2;
  let need=(-Math.PI/2-target)-cur; need=((need%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const start=angle,delta=(5+Math.floor(Math.random()*3))*Math.PI*2+need;
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur=reduced?600:Math.max(2,Math.min(15,+S.dur||6))*1000;
  const t0=performance.now(); let last=-1;
  const ease=t=>1-Math.pow(1-t,3.2);
  (function frame(now){
    const t=Math.min(1,(now-t0)/dur);
    angle=start+delta*ease(t); draw();
    const idx=S.items.indexOf(pick());
    if(idx!==last){ if(last>=0) beep(700+Math.random()*300); last=idx; }
    if(t<1) requestAnimationFrame(frame); else done();
  })(t0);
}
function done(){
  busy=false; $('hub').disabled=false; $('spinBtn').disabled=false;
  const got=pick();
  S.spun++; S.hist.unshift({n:got.n,t:Date.now()}); if(S.hist.length>100) S.hist.length=100;
  if(S.remove&&S.items.length>1) S.items.splice(S.items.indexOf(got),1);   /* 只拿掉這一格，同名的其他格留著 */
  save(); render();
  $('prizeTxt').textContent=got.n; $('mask').hidden=false; $('againBtn').focus();
  fanfare(); confetti();
}

/* ── 側欄 ── */
function render(){
  const L=$('list'); L.innerHTML='';
  S.items.forEach((it,i)=>{
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<span class="dot" style="background:'+COLORS[i%COLORS.length]+'"></span>'+
      '<input type="text" maxlength="20" aria-label="獎項名稱"><input type="number" min="0" max="999" step="1" aria-label="權重" title="權重，越大越容易中；0 不會出現在轉盤上">'+
      '<button class="del" title="刪除" aria-label="刪除">×</button>';
    const [name,w]=row.querySelectorAll('input');
    name.id='name'+i; w.id='w'+i; name.value=it.n; w.value=it.w;
    if(secret){
      row.classList.add('sec-on');
      const b=document.createElement('button'); b.type='button'; b.className='ghost'+(it.x?' on':'');
      b.title='只展示、不會中'; b.textContent=it.x?'不中':'會中';
      b.onclick=()=>{ it.x=!it.x; save(); render(); };
      row.insertBefore(b,row.querySelector('.del'));
    }
    name.oninput=()=>{ it.n=name.value.trim()||('獎項'+(i+1)); save(); draw(); updCnt(); };
    w.onchange=()=>{ it.w=Math.max(0,Math.min(999,Math.round(+w.value)||0)); w.value=it.w; save(); draw(); updCnt(); };
    row.querySelector('.del').onclick=()=>{
      if(S.items.length<=2){ alert('至少要留 2 個獎項'); return; }
      S.items.splice(i,1); save(); render();
    };
    L.appendChild(row);
  });
  const H=$('hist'); H.innerHTML='';
  if(!S.hist.length) H.innerHTML='<li class="none">還沒有抽過</li>';
  const pad=x=>String(x).padStart(2,'0');
  S.hist.forEach(h=>{
    const li=document.createElement('li'),d=new Date(h.t);
    li.innerHTML='<span></span><time>'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+'</time>';
    li.firstChild.textContent=h.n; H.appendChild(li);
  });
  $('spun').textContent=S.spun;
  $('optRemove').checked=!!S.remove; $('optSound').checked=S.sound!==false; $('optDur').value=S.dur||6;
  updCnt(); draw();
}
function updCnt(){ $('cnt').textContent=active().length+' 個獎項'; }
const closeModal=()=>{ $('mask').hidden=true; };

/* 標題跟說明直接點著改，存起來下次還在 */
[['ttl','title'],['sub','sub']].forEach(([id,key])=>{
  const el=$(id); el.textContent=S[key]||'';
  el.oninput=()=>{ S[key]=el.textContent.replace(/\n/g,' ').trim().slice(0,60); save(); if(key==='title') document.title=S.title||el.dataset.ph; };
  el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); } };
  el.onpaste=e=>{ e.preventDefault(); document.execCommand('insertText',false,(e.clipboardData.getData('text')||'').replace(/\n/g,' ')); };
  el.onblur=()=>{ el.textContent=S[key]||''; };   /* 清掉多餘的換行或格式 */
});
document.title=S.title||$('ttl').dataset.ph;

/* 隱藏設定：「已抽 N 次」那行字快速點 5 下切換。關著的時候頁面上完全看不出來 */
let taps=[];
document.querySelector('.count').addEventListener('click',()=>{
  const now=Date.now(); taps=taps.filter(t=>now-t<2000); taps.push(now);
  if(taps.length>=5){ taps=[]; secret=!secret; render(); }
});
/* 加到主畫面之後沒有網址列，靠這顆抓新版。設定都在 localStorage，重新載入不會動到 */
$('reloadBtn').onclick=()=>location.reload();
$('addBtn').onclick=()=>{
  const v=$('newName').value.trim(); if(!v){ $('newName').focus(); return; }
  if(S.items.length>=36){ alert('最多 36 個獎項'); return; }
  S.items.push({n:v,w:1}); $('newName').value=''; save(); render();
};
$('newName').onkeydown=e=>{ if(e.key==='Enter') $('addBtn').click(); };
$('defaultBtn').onclick=()=>{ if(confirm('還原成預設獎項？')){ S.items=DEFAULT.map(x=>({...x})); save(); render(); } };
$('optRemove').onchange=e=>{ S.remove=e.target.checked; save(); };
$('optSound').onchange=e=>{ S.sound=e.target.checked; save(); };
$('optDur').onchange=e=>{ S.dur=Math.max(2,Math.min(15,+e.target.value||6)); e.target.value=S.dur; save(); };
$('clearHist').onclick=()=>{ if(S.hist.length&&confirm('清除所有紀錄？')){ S.hist=[]; S.spun=0; save(); render(); } };
$('spinBtn').onclick=spin; $('hub').onclick=spin;
$('closeBtn').onclick=closeModal;
$('againBtn').onclick=()=>{ closeModal(); setTimeout(spin,120); };
$('mask').onclick=e=>{ if(e.target===$('mask')) closeModal(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
  if(e.key===' '&&!/INPUT|BUTTON/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){ e.preventDefault(); if($('mask').hidden) spin(); }
});

/* ── 彩帶 ── */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('confetti'),x=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const P=Array.from({length:150},()=>({
    x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
    s:6+Math.random()*8,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,
    col:COLORS[Math.floor(Math.random()*COLORS.length)]}));
  const t0=performance.now();
  (function f(now){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=.05;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(now-t0<2600) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height);
  })(t0);
}
THEMES.forEach((t,i)=>{
  const b=document.createElement('button'); b.type='button'; b.className='sw'; b.title=t.n; b.setAttribute('aria-label',t.n);
  b.style.background='conic-gradient('+t.c[0]+' 0 33%,'+t.c[1]+' 0 66%,'+t.c[2]+' 0)';
  b.style.setProperty('--swc',t.v.red);
  b.onclick=()=>{ applyTheme(i); save(); draw(); };
  $('themes').appendChild(b);
});
applyTheme(S.theme|0);
render();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
</script>
</body>
</html>
